autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
targetAverageUtilization: 100
gateway:
  enabled: true
  hostnames:
    - coda.uw.edu
lifecycle:
  enabled: true
  preStop:
    enabled: true
affinity:
   podsSpanNodes: true
readiness:
  enabled: true
database:
  engine: postgres
  name: coda_prod
  hostname: coda-prod-db-service
  secretName: coda.uw.edu-sql-secrets
externalService:
  enabled: true
  name: coda-prod-db-service
  type: ClusterIP
  serviceAddress: 172.18.1.200
  servicePort: 5432
repo: coda
instance: prod
namespace:
  enabled: true
image:
  repository: us-docker.pkg.dev/uwit-mci-axdd/containers/coda
  tag: IMAGE_TAG
memcached:
  enabled: true
  replicaCount: 2
  updateStrategy:
    type: RollingUpdate
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
cronjob:
  enabled: true
  jobs:
    - name: load-term-data
      schedule: "15 4 * * *"
      command: ["/scripts/management_command.sh"]
      args: ["load_data_for_term", "--next"]
      resources:
        limits:
          cpu: 750m
          memory: 768Mi
        requests:
          cpu: 500m
          memory: 256Mi
certs:
  mounted: true
  certPath: /certs/coda.uw.edu.cert
  keyPath: /certs/coda.uw.edu.key
  secretName: coda.uw.edu-uwca-certs
mountedSecrets:
  enabled: true
  mountPath: /ssl
  secretName: coda.uw.edu-openssl-conf
environmentVariables:
  - name: ENV
    value: prod
  - name: OPENSSL_CONF
    value: /ssl/openssl.cnf
  - name: WEBSERVER
    value: nginx
  - name: SESSION_BACKEND
    value: MEMCACHED
  - name: GWS_ENV
    value: PROD
  - name: SWS_ENV
    value: PROD
  - name: PWS_ENV
    value: PROD
  - name: PWS_POOL_SIZE
    value: "100"
  - name: PWS_CONNECT_TIMEOUT
    value: "10"
  - name: CANVAS_ENV
    value: PROD
  - name: BOOKSTORE_ENV
    value: PROD
  - name: UW_PERSON_DB_HOST
    value: 172.18.1.67
  - name: UW_PERSON_DB_PORT
    value: '5432'
  - name: UW_PERSON_DB_NAME
    value: uw-person-prod
  - name: AUTH
    value: SAML
  - name: SAML_ENTITY_ID
    value: https://coda.uw.edu/shibboleth
  - name: CLUSTER_CNAME
    value: coda.uw.edu
  - name: MEMCACHED_MAX_POOL_SIZE
    value: "10"

externalSecrets:
  enabled: true
  secrets:
    - name: coda.uw.edu-secrets
      externalKey: coda/prod/secrets
      data:
        - name: django-secret
          property: django-secret
    - name: coda.uw.edu-shared-secrets
      externalKey: coda/shared/secrets
      data:
        - name: canvas-account-id
          property: canvas-account-id
        - name: canvas-api-token
          property: canvas-api-token
        - name: person-db-user
          property: person-db-user
        - name: person-db-pass
          property: person-db-pass
    - name: coda.uw.edu-sql-secrets
      externalKey: coda/prod/sql-secrets
      data:
        - name: username
          property: sql_user
        - name: password
          property: sql_pass
    - name: coda.uw.edu-uwca-certs
      externalKey: coda/prod/uwca-certs
      data:
        - name: coda.uw.edu.cert
          property: cert
        - name: coda.uw.edu.key
          property: key
    - name: coda.uw.edu-uw-idp-cert
      externalKey: idp-cert
      data:
        - name: uw-idp-cert
          property: cert
    - name: coda.uw.edu-openssl-conf
      externalKey: openssl-conf
      data:
        - name: openssl.cnf
          property: openssl.cnf

environmentVariablesSecrets:
  djangoSecret:
    name: DJANGO_SECRET
    secretName: coda.uw.edu-secrets
    secretKey: django-secret
  canvasAccountID:
    name: CANVAS_ACCOUNT_ID
    secretName: coda.uw.edu-shared-secrets
    secretKey: canvas-account-id
  canvasAPIToken:
    name: CANVAS_OAUTH_BEARER
    secretName: coda.uw.edu-shared-secrets
    secretKey: canvas-api-token
  personDBUser:
    name: UW_PERSON_DB_USER
    secretName: coda.uw.edu-shared-secrets
    secretKey: person-db-user
  personDBPass:
    name: UW_PERSON_DB_PASSWORD
    secretName: coda.uw.edu-shared-secrets
    secretKey: person-db-pass
  SAMLServiceProviderCert:
    name: SP_CERT
    secretName: coda.uw.edu-uwca-certs
    secretKey: coda.uw.edu.cert
  SAMLIDPCert:
    name: IDP_CERT
    secretName: coda.uw.edu-uw-idp-cert
    secretKey: uw-idp-cert
