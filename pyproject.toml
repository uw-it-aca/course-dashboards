[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coursedashboards"
dynamic = ["version"]
description = "A Django App for viewing UW course insights"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "UWIT Student & Educational Technology Services", email = "aca-it@uw.edu"}
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "django~=5.2",
    "django-compressor",
    "pyscss@git+https://github.com/kronuz/pyscss.git",  # master branch!
    "django-pyscss>=2.0",
    "django_mobileesp",
    "uw-memcached-clients~=1.0",
    "uw-restclients-core~=1.4",
    "uw-restclients-sws~=2.5",
    "uw-restclients-pws~=2.1",
    "uw-restclients-gws~=2.3",
    "uw-restclients-django-utils~=2.3",
    "uw-restclients-canvas~=1.2",
    "uw-restclients-bookstore~=1.1",
    "uw-django-saml2~=1.8",
    "django-supporttools~=3.6",
    "djangorestframework~=3.15",
    "django-persistent-message~=1.3",
    "django-person-client~=2.1",
    "statistics",
    "psycopg[c]",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["coursedashboards"]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "coursedashboards/VERSION"}

[tool.ruff]
line-length = 88
exclude = [
    "coursedashboards/migrations/*",
]

[tool.ruff.lint]
ignore = [
    "UP017",  # Use `datetime.UTC` alias
]

[tool.coverage.run]
source = ["coursedashboards"]
parallel = true
omit = [
     "coursedashboards/migrations/*",
     "coursedashboards/tests/*"
]

[tool.coverage.paths]
source = [
    "coursedashboards/",
    "/app/coursedashboards/",
]
